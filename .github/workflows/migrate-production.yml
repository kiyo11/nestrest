name: Migrate Production

# Applies Prisma migrations to the production database AFTER a merge to main.
# Kept explicit and gated rather than running silently inside the Vercel build,
# so schema changes against prod are intentional and auditable.
#
# No-ops until this secret is configured:
#   PRODUCTION_DATABASE_URL — the production Postgres DIRECT (non-pooled) URL,
#   e.g. the Neon direct connection string (Prisma migrate needs a direct conn).

on:
  push:
    branches: [main]

jobs:
  migrate:
    if: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
